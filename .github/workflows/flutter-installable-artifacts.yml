name: Flutter installable artifacts

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/flutter/leleg_iptv
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --release --flavor mobile
      - name: Build native Android TV APK
        working-directory: native/android-tv
        run: ./gradlew assembleRelease
      - name: Package Android APK
        working-directory: .
        run: |
          mkdir -p www/downloads/current
          cp native/flutter/leleg_iptv/build/app/outputs/flutter-apk/app-mobile-release.apk \
            www/downloads/current/LelegIPTV-android-universal-release.apk
          cp native/android-tv/app/build/outputs/apk/release/app-release.apk \
            www/downloads/current/LelegIPTV-android-tv-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LelegIPTV-android-universal-release
          path: www/downloads/current/LelegIPTV-android-universal-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LelegIPTV-android-tv-release
          path: www/downloads/current/LelegIPTV-android-tv-release.apk

  windows:
    name: Windows desktop bundle
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/flutter/leleg_iptv
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package Windows x64 ZIP
        working-directory: .
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force www/downloads/current | Out-Null
          Compress-Archive `
            -Path native/flutter/leleg_iptv/build/windows/x64/runner/Release/* `
            -DestinationPath www/downloads/current/LelegIPTV-windows-x64-release.zip `
            -Force
      - uses: actions/upload-artifact@v4
        with:
          name: LelegIPTV-windows-x64-release
          path: www/downloads/current/LelegIPTV-windows-x64-release.zip

  linux:
    name: Linux desktop bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native/flutter/leleg_iptv
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package Linux x64 TAR
        working-directory: .
        run: |
          mkdir -p www/downloads/current
          tar -C native/flutter/leleg_iptv/build/linux/x64/release/bundle \
            -czf www/downloads/current/LelegIPTV-linux-x64-release.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: LelegIPTV-linux-x64-release
          path: www/downloads/current/LelegIPTV-linux-x64-release.tar.gz

  macos-ios:
    name: macOS and unsigned iOS build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: native/flutter/leleg_iptv
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: flutter build macos --release
      - run: flutter build ios --release --no-codesign
      - name: Package macOS app ZIP
        working-directory: .
        run: |
          mkdir -p www/downloads/current
          ditto -c -k --keepParent \
            native/flutter/leleg_iptv/build/macos/Build/Products/Release/leleg_iptv.app \
            www/downloads/current/LelegIPTV-macos-arm64-release.zip
      - name: Package unsigned IPA
        working-directory: .
        run: bash scripts/package-flutter-ios-unsigned-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: LelegIPTV-macos-arm64-release
          path: www/downloads/current/LelegIPTV-macos-arm64-release.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LelegIPTV-ios-unsigned-ipa
          path: www/downloads/current/LelegIPTV-ios-unsigned.ipa

  publish-latest-release:
    name: Publish latest native release
    runs-on: ubuntu-latest
    needs:
      - android
      - windows
      - linux
      - macos-ios
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: LelegIPTV native latest
          body: |
            Artefatti installabili LelegIPTV.
            Android TV, Chromecast e Fire TV usano il modulo Kotlin/Compose TV nativo.
            Windows x64 e Linux x64 sono prodotti dalla CI; Windows ARM64 va generato da Parallels se necessario.
          make_latest: true
          files: release-assets/*
