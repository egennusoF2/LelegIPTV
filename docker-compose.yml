services:
  stream-proxy:
    image: node:22-alpine
    container_name: lelegiptv-stream-proxy
    working_dir: /app
    volumes:
      - ./scripts/stream-proxy.mjs:/app/stream-proxy.mjs:ro
    command: node stream-proxy.mjs
    restart: unless-stopped
    environment:
      PROXY_PORT: 3001
    expose:
      - "3001"

  web:
    image: caddy:2-alpine
    container_name: lelegiptv-web
    volumes:
      - ./dist:/usr/share/caddy:ro
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - stream-proxy
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
